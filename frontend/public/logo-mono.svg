<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background (white) -->
  <rect width="200" height="200" rx="46" fill="#ffffff"/>

  <!-- Subtle inner shade at top -->
  <rect x="10" y="10" width="180" height="90" rx="36" fill="black" opacity="0.04"/>

  <!-- Bug head -->
  <circle cx="100" cy="76" r="28" fill="#0a0a0a"/>

  <!-- Bug eyes (white punch-through) -->
  <circle cx="89" cy="73" r="6" fill="#ffffff"/>
  <circle cx="111" cy="73" r="6" fill="#ffffff"/>

  <!-- Eye shine -->
  <circle cx="91" cy="71" r="2" fill="black" opacity="0.5"/>
  <circle cx="113" cy="71" r="2" fill="black" opacity="0.5"/>

  <!-- Bug body (pill) -->
  <rect x="67" y="96" width="66" height="80" rx="33" fill="#0a0a0a"/>

  <!-- Body segment divider -->
  <line x1="70" y1="132" x2="130" y2="132" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- Left antenna -->
  <line x1="88" y1="51" x2="70" y2="32" stroke="#0a0a0a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="68" cy="30" r="5.5" fill="#0a0a0a"/>

  <!-- Right antenna -->
  <line x1="112" y1="51" x2="130" y2="32" stroke="#0a0a0a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="132" cy="30" r="5.5" fill="#0a0a0a"/>

  <!-- Left legs -->
  <line x1="67" y1="110" x2="42" y2="99"  stroke="#0a0a0a" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="67" y1="132" x2="40" y2="132" stroke="#0a0a0a" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="67" y1="154" x2="42" y2="165" stroke="#0a0a0a" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Right legs -->
  <line x1="133" y1="110" x2="158" y2="99"  stroke="#0a0a0a" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="133" y1="132" x2="160" y2="132" stroke="#0a0a0a" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="133" y1="154" x2="158" y2="165" stroke="#0a0a0a" stroke-width="5.5" stroke-linecap="round"/>
</svg>
